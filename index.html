<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriadGamified - Guitar Triad Challenge</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --accent: #f43f5e;
            --success: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 1rem; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem; color: var(--primary); }
        .subtitle { text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .screen { display: none; }
        .screen.active { display: block; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        input[type="text"], select { width: 100%; padding: 0.75rem 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: var(--text); font-size: 1rem; }
        input[type="text"]:focus, select:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 0.75rem; background: var(--primary); color: #0f172a; font-weight: 600; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--text-muted); background: #0f172a; padding: 0.75rem 1rem; border-radius: 0.5rem; }
        .timer-container { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-bottom: 1.5rem; overflow: hidden; }
        .timer-bar { height: 100%; background: var(--accent); width: 100%; transition: width 0.1s linear; }
        .question-box { font-size: 1.25rem; font-weight: 600; text-align: center; margin-bottom: 1.5rem; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
        .option-btn { background: #0f172a; border: 1px solid #334155; color: var(--text); padding: 1rem; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #1e293b; }
        .option-btn.correct { background: var(--success) !important; color: #fff; border-color: var(--success); }
        .option-btn.wrong { background: var(--accent) !important; color: #fff; border-color: var(--accent); }
        .leaderboard-list { list-style: none; margin-bottom: 1.5rem; max-height: 200px; overflow-y: auto; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 0.75rem 1rem; background: #0f172a; border-radius: 0.5rem; margin-bottom: 0.5rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>🎸 TriadGamified</h1>
            <div class="subtitle">Customizable Guitar Triad Challenge</div>
            <div class="form-group">
                <label for="player-name">Player Name</label>
                <input type="text" id="player-name" placeholder="Enter your name..." maxlength="20" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="question-count">Number of Questions</label>
                <select id="question-count">
                    <option value="5">5 Questions</option>
                    <option value="10">10 Questions</option>
                    <option value="15">15 Questions</option>
                    <option value="20" selected>20 Questions</option>
                </select>
            </div>
            <div class="form-group">
                <label for="time-limit">Time Per Question</label>
                <select id="time-limit">
                    <option value="5">5 Seconds</option>
                    <option value="10" selected>10 Seconds</option>
                    <option value="15">15 Seconds</option>
                    <option value="20">20 Seconds</option>
                    <option value="25">25 Seconds</option>
                    <option value="30">30 Seconds</option>
                    <option value="35">35 Seconds</option>
                    <option value="40">40 Seconds</option>
                    <option value="45">45 Seconds</option>
                    <option value="50">50 Seconds</option>
                    <option value="55">55 Seconds</option>
                    <option value="60">60 Seconds</option>
                </select>
            </div>
            <button id="start-btn">Start Challenge</button>
            <div style="margin-top: 1.5rem;">
                <h3 style="font-size: 1rem; margin-bottom: 0.75rem; color: var(--text-muted);">🏆 Leaderboard</h3>
                <ul id="start-leaderboard" class="leaderboard-list"></ul>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="stats-bar">
                <span id="q-counter">Question 1/20</span>
                <span id="score-display">Score: 0</span>
            </div>
            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div id="question-text" class="question-box"></div>
            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h1>Challenge Completed! 🎉</h1>
            <div style="text-align: center; margin-bottom: 1.5rem; font-size: 1.25rem;" id="final-score-text"></div>
            <h3 style="font-size: 1rem; margin-bottom: 0.75rem; color: var(--text-muted);">🏆 Leaderboard</h3>
            <ul id="final-leaderboard" class="leaderboard-list"></ul>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "Play me C in A Shape, which fret to start?", answer: "3rd Fret", options: ["3rd Fret", "5th Fret", "7th Fret", "10th Fret"] },
            { q: "Play me G in E Shape, which fret to start?", answer: "3rd Fret", options: ["2nd Fret", "3rd Fret", "7th Fret", "10th Fret"] },
            { q: "Play me D Minor in D Shape, which fret to start?", answer: "Open", options: ["Open", "2nd Fret", "5th Fret", "7th Fret"] },
            { q: "Play me Bb Major in A Shape, which fret to start?", answer: "1st Fret", options: ["Open", "1st Fret", "3rd Fret", "5th Fret"] },
            { q: "Play me F# Major in E Shape, which fret to start?", answer: "2nd Fret", options: ["Open", "2nd Fret", "4th Fret", "6th Fret"] },
            { q: "Play me A in D Shape, which fret to start?", answer: "7th Fret", options: ["2nd Fret", "5th Fret", "7th Fret", "9th Fret"] },
            { q: "Play me E Minor in E Shape, which fret to start?", answer: "Open", options: ["Open", "3rd Fret", "7th Fret", "10th Fret"] },
            { q: "Play me G in D Shape, which fret to start?", answer: "5th Fret", options: ["2nd Fret", "5th Fret", "9th Fret", "12th Fret"] },
            { q: "Play me Bb Minor in A Shape, which fret to start?", answer: "1st Fret", options: ["1st Fret", "3rd Fret", "6th Fret", "8th Fret"] },
            { q: "Play me D Major in D Shape, which fret to start?", answer: "Open", options: ["Open", "2nd Fret", "7th Fret", "12th Fret"] },
            { q: "Play me E Major in A Shape, which fret to start?", answer: "7th Fret", options: ["Open", "5th Fret", "7th Fret", "10th Fret"] },
            { q: "Play me G Minor in E Shape, which fret to start?", answer: "3rd Fret", options: ["2nd Fret", "3rd Fret", "7th Fret", "10th Fret"] },
            { q: "Play me C Major in D Shape, which fret to start?", answer: "10th Fret", options: ["5th Fret", "8th Fret", "10th Fret", "12th Fret"] },
            { q: "Play me A Minor in D Shape, which fret to start?", answer: "7th Fret", options: ["2nd Fret", "5th Fret", "7th Fret", "9th Fret"] },
            { q: "Play me F Major in A Shape, which fret to start?", answer: "8th Fret", options: ["3rd Fret", "5th Fret", "8th Fret", "10th Fret"] },
            { q: "Play me B Major in E Shape, which fret to start?", answer: "7th Fret", options: ["2nd Fret", "5th Fret", "7th Fret", "10th Fret"] },
            { q: "Play me D Major in A Shape, which fret to start?", answer: "5th Fret", options: ["3rd Fret", "5th Fret", "9th Fret", "12th Fret"] },
            { q: "Play me E Minor in D Shape, which fret to start?", answer: "2nd Fret", options: ["Open", "2nd Fret", "7th Fret", "12th Fret"] },
            { q: "Play me C# Minor in E Shape, which fret to start?", answer: "9th Fret", options: ["4th Fret", "7th Fret", "9th Fret", "11th Fret"] },
            { q: "Play me G Major in D Shape, which fret to start?", answer: "5th Fret", options: ["2nd Fret", "5th Fret", "9th Fret", "12th Fret"] }
        ];

        let activeQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let playerName = "";
        let selectedTimeLimit = 10;
        let timer = null;
        let timeLeft = 10;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const playerNameInput = document.getElementById('player-name');
        const questionCountSelect = document.getElementById('question-count');
        const timeLimitSelect = document.getElementById('time-limit');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const qCounter = document.getElementById('q-counter');
        const scoreDisplay = document.getElementById('score-display');
        const timerBar = document.getElementById('timer-bar');
        const finalScoreText = document.getElementById('final-score-text');

        function getScores() {
            try {
                return JSON.parse(localStorage.getItem('triadgamified_scores')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveScore(name, sc, total) {
            let scores = getScores();
            scores.push({ name, score: `${sc}/${total}`, date: new Date().toLocaleDateString() });
            scores.sort((a, b) => parseInt(b.score) - parseInt(a.score));
            localStorage.setItem('triadgamified_scores', JSON.stringify(scores.slice(0, 10)));
        }

        function renderLeaderboards() {
            const scores = getScores();
            const html = scores.length === 0 ? '<li class="leaderboard-item"><span>No scores yet. Be the first!</span><span>-</span></li>' :
                scores.map((s, i) => `<li class="leaderboard-item"><span>#${i+1} ${s.name}</span><span>${s.score}</span></li>`).join('');
            document.getElementById('start-leaderboard').innerHTML = html;
            document.getElementById('final-leaderboard').innerHTML = html;
        }

        renderLeaderboards();

        startBtn.addEventListener('click', () => {
            playerName = playerNameInput.value.trim() || "Anonymous Player";
            const count = parseInt(questionCountSelect.value);
            selectedTimeLimit = parseInt(timeLimitSelect.value);

            activeQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, count);

            currentIdx = 0;
            score = 0;
            startScreen.classList.remove('active');
            quizScreen.classList.add('active');
            loadQuestion();
        });

        restartBtn.addEventListener('click', () => {
            resultsScreen.classList.remove('active');
            startScreen.classList.add('active');
            renderLeaderboards();
        });

        function loadQuestion() {
            if (currentIdx >= activeQuestions.length) {
                endQuiz();
                return;
            }

            const q = activeQuestions[currentIdx];
            qCounter.textContent = `Question ${currentIdx + 1}/${activeQuestions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionText.textContent = q.q;

            optionsGrid.innerHTML = '';
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => selectAnswer(opt, q.answer, btn));
                optionsGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = selectedTimeLimit;
            timerBar.style.width = '100%';
            
            const intervalTime = 100;
            const decrement = intervalTime / (selectedTimeLimit * 1000);

            timer = setInterval(() => {
                timeLeft -= (intervalTime / 1000);
                const pct = Math.max(0, (timeLeft / selectedTimeLimit) * 100);
                timerBar.style.width = `${pct}%`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeout();
                }
            }, intervalTime);
        }

        function handleTimeout() {
            const buttons = optionsGrid.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.disabled = true;
                const q = activeQuestions[currentIdx];
                if (b.textContent === q.answer) b.classList.add('correct');
            });

            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1200);
        }

        function selectAnswer(selected, correct, btn) {
            clearInterval(timer);
            const buttons = optionsGrid.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
            } else {
                btn.classList.add('wrong');
                buttons.forEach(b => {
                    if (b.textContent === correct) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1200);
        }

        function endQuiz() {
            clearInterval(timer);
            quizScreen.classList.remove('active');
            resultsScreen.classList.add('active');
            finalScoreText.textContent = `${playerName}, you scored ${score} out of ${activeQuestions.length}!`;
            saveScore(playerName, score, activeQuestions.length);
            renderLeaderboards();
        }
    </script>
</body>
</html>
